[package]
name = "ombra-humanize"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"
publish = false
description = "Persona and input planners behind Ombra's humanized CDP input"

# Only crates that Chromium vendors in //third_party/rust, so GN can build this crate too (D1, D3).
[dependencies]
serde = { version = "1", features = ["derive"] }
# The scroll table of each OS ships inside the crate as JSON (data/).
serde_json = "1"
