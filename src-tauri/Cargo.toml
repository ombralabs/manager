[package]
name = "ombra"
version = "1.2.3"
description = "Ombra browser profile management and automation"
authors = ["Ombra Labs"]
license = "GPL-3.0-only"
repository = "https://github.com/ombralabs/manager"
edition = "2024"
rust-version = "1.90"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ombra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
fern = "0.7"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
chacha20poly1305 = "0.10"
getrandom = "0.3"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
ring = "0.17"
zeroize = { version = "1", features = ["derive"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"
tar = "0.4"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }
csv = "1"
tempfile = "3"
open = "5"
rpassword = "7"
xz2 = { version = "0.1", features = ["static"] }
tzf-rs = { version = "2.1", default-features = false, features = ["bundled"] }
jiff-tzdb = "=0.1.8"
libc = "0.2"
tokio-util = "0.7"
tokio-socks = "0.5"
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Персона очеловечивания из seed — тот же крейт, что собран в движок (ombra-engine, решение D3): для показа почерка.
ombra-humanize = { path = "../vendor/ombra-engine/crates/ombra-humanize" }
calamine = "0.37.0"
rust_xlsxwriter = "0.101.0"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11.9"

[dev-dependencies]
rcgen = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
