name: Desktop builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: node --test tools/release/*.node-test.mjs
      - run: npm ci
      - run: npm run check:web

  build:
    needs: frontend
    name: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libdbus-1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm xdg-utils xclip wl-clipboard
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add '${{ matrix.target }}'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          cache-on-failure: true
      - run: npm ci
      - name: Ensure frontend dist placeholder exists
        run: mkdir -p dist
      - name: Rust tests
        if: matrix.platform == 'darwin-arm64' || matrix.platform == 'linux-x64'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers and archives
        run: node tools/release/build.mjs '${{ matrix.platform }}'
      - name: Check CLI startup
        run: node tools/release/smoke.mjs '${{ matrix.platform }}'
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: ombra-desktop-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
